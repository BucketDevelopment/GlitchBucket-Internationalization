      description: Tra cứu thông tin cắt điện tại khu vực của bạn
      options:
        provider: Nhập tên tỉnh/thành phố của bạn để bắt đầu tìm kiếm.
        subprovider: Nhập tên huyện/xã/thị trấn của bạn để bắt đầu tìm kiếm.
        time: 'Nhập ngày cần tìm với định dạng: DD/MM/YYYY. Nhập ''today'' hoặc
          bỏ trống để kiểm tra ngày hôm nay'
        keyword: Nhập thêm từ khóa để tìm kiếm lịch cắt điện

    unsubscribe: 
      description: Hủy bỏ thông báo cắt điện tự động

    subscribe: 
      description: Nhận thông báo cắt điện tự động

      options:
        provider: Nhập mã điện lực của tỉnh/thành phố. Sử dụng </outage provider>
          để xem mã điện lực.
        keyword: Nhận thông báo khi khu mất điện chứa từ khóa dưới đây. 

gtn: 
  description: Create a Guess the number game instance
  commands:
    create: 
      description: Create 'Guess the number' Game
    options:
      num_range: Generate a random number between 0 and {num_range}, default is
        400, can only in range 1 - 10000
      start_after: The time (minute) to start after the command being submitted, default
        is 2, can only in range 1 - 10
      game_rounds: Maximum number of round to play, default is 15, can only in range 1 - 20
      round_duration: Duration on each round, default is 45, can only in range 25 - 90
