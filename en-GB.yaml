donation: 
  description: Setup automatic receive donations in your server
  commands:
    enable: 
      description: Setup donations record for this server
      options:
        channel: Specify a channel to automatically receive donations from members
          through another bot's currency
        receiver: Specify an user, who will be the donation's receiver
    
    autoreceive: 
      description: Toggle automatic donations record for this server (does not disable
        the feature)
      options:
        action: Specify an action
    
    disable: 
      description: Disable donations record for this server
      options:
        delete: Destruct Action   Delete server's donation data
    
    threshold: 
      description: Edit donation announce threshold
      options:
        threshold: Specify threshold, if the donation amount is larger than this,
          we will announce it to donation…
    
    leaderboard: 
      description: View donations leaderboard
      options:
        range: Specify a range for query
        limit: Specify a limit for the query
    
    message: 
      description: Edit donation message when triggered
      options:
        message: 'Placeholders: {amount}, {donator_id}, {donator_name}, {donator_displayname},
          {donator_mention}'
    
    receiverole: 
      description: Set a role for receiver
      options:
        role: Specify a role, which will be the role for donation's receiver
        delete: Whether delete this receive role or not
    
    receiver: 
      description: Add/Remove a receiver
      options:
        action: Select an action
        receiver: Specify an user, who will be the donation's receiver
    
    announcement: 
      description: Set donations announce channel
      options:
        channel: Specify a channel, which will be donation announce channel

    reward: 
      description: Set rewards (role) after specific amount of donation points
      options:
        action: Select an action
        role: Specify a role to add, if the donation amount is larger than {threshold}
          points
        threshold: Specify threshold, which the bot add the reward to user, if the
          donation amount is larger than this

    configuration: 
      description: Check configuration about Automatic donation receiver
      options:
        action: Select an action
        channel: Specify a channel, which it will be the donations receive channel

    serverstats: 
      description: Send statistics about server's donation

    userstats: 
      description: Check donation information of an user
      options:
        user: Specify an user

    add: 
      description: Add amount of donation balance to an user
      options:
        user: Specify an user
        amount: Specify the amount to add
        announce: Whether we should announce this or not
        reason: Specify a reason for this action
        silent: Whether this command should be executed in silent or not

    subtract: 
      description: Subtract amount of donation balance from an user
      options:
        user: Specify an user
        amount: Specify the amount to subtract
        reason: Specify a reason for this action
        silent: Whether this command should be executed in silent or not
  
