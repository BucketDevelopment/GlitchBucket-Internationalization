quickreport: 
  description: Quickly report violation messages to Server Moderator
  commands:
    enable: 
      description: Enable Quick Report feature
      options:
        receive_channel: Specify a channel to receive incoming reports

    configuration: 
      description: View current Quick Report configuration of this server
    
    disable: 
      description: Disable Quick Report feature
    
    muterole: 
      description: Set an exists mute role of another moderation's bots
      options:
        role: "…"
    
    manager: 
      description: Set a report manager's role
      options:
        role: Specify a role
    
    bypass: 
      description: Set a role that will protect users against reports
      options:
        role: Specify a role
    
    blacklist: 
      description: Set a role that will made users cannot report other messages
      options:
        role: Specify a role
    
    autoexpire: 
      description: Set a timeout for reports when theres no moderators handle it after
        specific time
      options:
        after: Specify hours range, which reports will auto timeout after that
          specified hours
    
    concurrent: 
      description: Set maximum concurrent reports for each users
      options:
        maximum: Specify a value
    auto_delele: 
      description: Set the bot to automatically delete reports on some events
      options:
        on_user_timeout: Whether delete reports when that user has been timed out
        on_user_muted: Whether delete reports when that user is muted (a muterole has
          been given to them)
        on_user_leave: Whether delete reports when that user is banned/leave the server
    channels: 
      description: Whitelist/Blacklist Quick Report in some channels
      options:
        action: Specify an action
        channel: Specify a channel

    categories: 
      description: Whitelist/Blacklist Quick Report in some categories
      options:
        action: Specify an action
        category: Specify a category
    
    mode: 
      description: Toggle Quick Report mode
      options:
        action: Select an action
    
    update: 
      description: Approve/Decline a report
      options:
        action: Select an action
        report_id: Specify Report ID
        reason: Specify a reason for this approvement
        silent: Whether we sent this message in silent or not
    
    message: 
      description: Report a Message in this server
      options:
        channel: Specify the channel that contains the message
        message_id: Specify Message ID
        reason: The reason that you want to report this message
        silent: Whether we sent this message in silent or not

    recent: 
      description: Preview recent reports
      options:
        order: Select an action for sorting results
        silent: Whether we sent this message in silent or not
        status: Specify a status for query results
        reporter: Specify a reporter
        reported: Specify a member who has been reported

    check: 
      description: Preview a report based on ID
      options:
        report_id: Specify Report ID
        silent: Whether we sent this message in silent or not
